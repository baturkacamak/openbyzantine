<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420">
  <title>EA sahnesi: ilk arka plan ve aynı kod bloğunda açılan alanlar</title>
  <style>
    .area { fill: #00f5a0; fill-opacity: .15; stroke: #00f5a0; stroke-width: 2; }
    .area:hover { fill-opacity: .4; }
    .label { fill: white; font: bold 13px sans-serif; paint-order: stroke; stroke: #111; stroke-width: 3; }
  </style>
  <rect width="640" height="420" fill="#111"/>
  <image href="EAEmShMs.jpg" x="0" y="20" width="640" height="400"/>
  <g>
    <title>Alan 93: x=232 y=160, 105×159; komut 533 ile etkinleşiyor</title>
    <rect class="area" x="232" y="160" width="105" height="159"/>
    <text class="label" x="238" y="179">93</text>
  </g>
  <g>
    <title>Alan 76: x=539 y=320, 100×100; komut 533 ile etkinleşiyor</title>
    <rect class="area" x="539" y="320" width="100" height="100"/>
    <text class="label" x="545" y="339">76</text>
  </g>
</svg>
